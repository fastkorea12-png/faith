<style>
  :root { color-scheme: light; --bg: #eef1ea; --paper: #fffdf6; --ink: #20231f; --muted: #687066; --line: #d4d9cf; --forest: #243a31; --leaf: #6f8a5d; --clay: #9b563d; --gold: #b98a35; --warn: #8a3d31; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: var(--bg); color: var(--ink); }
  button, input, textarea { font: inherit; }
  button { cursor: pointer; border: 0; border-radius: 8px; padding: 12px 16px; background: var(--forest); color: #fffdf6; font-weight: 900; }
  .app-shell { width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: 26px 0 60px; }
  .top-panel, .progress-panel, .stage-card, .final-panel { border: 1px solid rgba(36, 58, 49, 0.16); border-radius: 8px; background: rgba(255, 253, 246, 0.95); box-shadow: 0 18px 46px rgba(32, 35, 31, 0.12); }
  .top-panel { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr); gap: 24px; padding: clamp(22px, 4vw, 42px); }
  .eyebrow { margin: 0 0 10px; color: var(--clay); font-size: 13px; font-weight: 900; text-transform: uppercase; }
  h1, h2, h3, p { margin-top: 0; }
  h1 { margin-bottom: 14px; font-size: clamp(38px, 7vw, 76px); line-height: 1.02; }
  .lead { max-width: 720px; margin-bottom: 0; color: var(--muted); font-size: clamp(17px, 2vw, 21px); line-height: 1.65; }
  .team-card { align-self: center; display: grid; gap: 10px; border-left: 4px solid var(--leaf); padding: 18px; background: rgba(238, 241, 234, 0.72); }
  label { color: var(--forest); font-weight: 900; }
  .team-card div { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fff; color: var(--ink); }
  textarea { resize: vertical; }
  .team-card p { margin: 0; color: var(--muted); font-size: 14px; }
  .progress-panel { margin: 14px 0; padding: 16px; }
  .progress-copy { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; color: var(--forest); font-weight: 900; }
  .progress-track { height: 12px; overflow: hidden; border-radius: 999px; background: #dfe5dc; }
  #progressBar { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--leaf), var(--gold)); transition: width 180ms ease; }
  .stage-layout { display: grid; grid-template-columns: 280px 1fr; gap: 14px; align-items: start; }
  .stage-list { display: grid; gap: 8px; position: sticky; top: 14px; }
  .stage-list button { display: grid; grid-template-columns: 42px 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--line); padding: 12px; background: rgba(255, 253, 246, 0.9); color: var(--ink); text-align: left; }
  .stage-list button.active { border-color: var(--forest); background: var(--forest); color: #fffdf6; }
  .stage-list span { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: rgba(111, 138, 93, 0.18); color: inherit; font-weight: 900; }
  .stage-list strong, .stage-list small { overflow-wrap: anywhere; }
  .stage-card { padding: clamp(20px, 4vw, 34px); }
  .stage-kicker { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .stage-kicker span { border-radius: 999px; padding: 7px 10px; background: rgba(111, 138, 93, 0.14); color: var(--forest); font-size: 13px; font-weight: 900; }
  .stage-card h2 { margin-bottom: 14px; font-size: clamp(30px, 4vw, 48px); line-height: 1.12; }
  .stage-card p { color: var(--muted); font-size: 17px; line-height: 1.7; }
  .mission-box, .hint-box, .recorder, .note-panel { border-radius: 8px; margin-top: 16px; padding: 16px; }
  .mission-box { border: 1px solid rgba(111, 138, 93, 0.34); background: rgba(111, 138, 93, 0.1); }
  .mission-box h3, .mission-box p { margin-bottom: 0; }
  .hint-box { border: 1px dashed var(--gold); background: rgba(185, 138, 53, 0.09); }
  .hint-box summary { color: var(--forest); font-weight: 900; cursor: pointer; }
  .hint-box p { margin: 10px 0 0; }
  .answer-form, .note-panel { display: grid; gap: 10px; }
  .answer-form { margin-top: 18px; }
  .answer-form button { justify-self: start; }
  .recorder { background: #1f3029; color: #fffdf6; font-weight: 800; line-height: 1.6; }
  .recorder[data-status="success"] { background: #2c563e; }
  .recorder[data-status="warn"] { background: var(--warn); }
  .note-panel { border: 1px solid var(--line); background: rgba(238, 241, 234, 0.7); }
  .final-panel { margin-top: 14px; padding: clamp(20px, 4vw, 34px); }
  .final-panel h2 { font-size: clamp(28px, 4vw, 44px); }
  .final-panel p { color: var(--muted); font-size: 18px; line-height: 1.68; }
  blockquote { margin: 18px 0; border-left: 4px solid var(--gold); padding-left: 16px; color: var(--forest); font-size: 22px; font-weight: 900; line-height: 1.5; }
  @media (max-width: 860px) { .top-panel, .stage-layout { grid-template-columns: 1fr; } .stage-list { position: static; } }
  @media (max-width: 560px) { .team-card div, .progress-copy, .stage-list button { grid-template-columns: 1fr; } .progress-copy { display: grid; } .team-card button, .answer-form button, .final-panel button { width: 100%; } }
</style>
